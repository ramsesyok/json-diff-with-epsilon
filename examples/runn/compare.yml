desc: Compare a JSON response with an expected file using runnora-diff
vars:
  actual: json://actual.json
steps:
  # In a real scenario the input would be an HTTP response body such as
  # steps.req.res.body.
  #
  # Note the trailing space after }} in stdin: without it runn parses the
  # expanded JSON back into a YAML map and rejects it as stdin.
  compare:
    exec:
      command: runnora-diff --config rules.yaml expected.json -
      stdin: '{{ toJSON(vars.actual) }} '
    test: current.stdout == "" && current.stderr == "" && current.exit_code == 0
  compare_json:
    exec:
      command: runnora-diff --format json --config rules.yaml expected.json -
      stdin: '{{ toJSON(vars.actual) }} '
    test: |
      current.exit_code == 0
      && fromJSON(current.stdout).summary.differences == 0
  detect_difference:
    exec:
      command: runnora-diff --format json expected.json -
      stdin: '{{ toJSON(vars.actual) }} '
    test: |
      current.exit_code == 1
      && fromJSON(current.stdout).summary.differences > 0
