version: 2

project_name: jsondiff-eps

builds:
  - id: jsondiff-eps
    main: ./cmd/jsondiff-eps
    binary: jsondiff-eps
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - docs/spec.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Dependencies
      regexp: '^.*Bump .*$'
      order: 1
    - title: Changes
      order: 0

release:
  header: |
    ## インストール

    ```sh
    go install github.com/ramsesyok/json-diff-with-epsilon/cmd/jsondiff-eps@{{ .Tag }}
    ```

    または下記のアーカイブから OS / アーキテクチャに合ったものをダウンロードし、`jsondiff-eps` を PATH の通った場所に置いてください。
