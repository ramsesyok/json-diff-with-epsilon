version: 2

project_name: runnora-diff

builds:
  - id: runnora-diff
    main: .
    binary: runnora-diff
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/spec.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Dependencies
      regexp: '^.*Bump .*$'
      order: 1
    - title: Changes
      order: 0

release:
  header: |
    ## インストール

    ```sh
    go install github.com/ramsesyok/runnora-diff@{{ .Tag }}
    ```

    または下記のアーカイブから OS / アーキテクチャに合ったものをダウンロードし、`runnora-diff` を PATH の通った場所に置いてください。
